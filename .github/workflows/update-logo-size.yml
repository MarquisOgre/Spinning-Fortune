name: Update logo size

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update header logo size
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          old = '<img src="/logo.png" alt="Fortune Draw" className="h-8 w-8 rounded object-cover" />'
          new = '<img src="/logo.png" alt="Fortune Draw" className="h-16 w-16 rounded object-cover" />'
          if old not in s:
              raise SystemExit('Expected logo markup not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          git commit -m "Increase header logo size [skip ci]"
          git push
