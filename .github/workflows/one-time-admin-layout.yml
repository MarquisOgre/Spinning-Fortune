name: Apply admin control layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-layout:
    if: github.actor == 'MarquisOgre'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch layout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('src/routes/index.tsx')
          s = index.read_text()

          old = '  const [forcedWinnerId, setForcedWinnerId] = useState<string>("random");'
          new = '''  const [forcedWinnerId, setForcedWinnerId] = useState<string>(() => {
            if (typeof window === "undefined") return "random";
            return window.localStorage.getItem("lucky-draw-forced-winner") ?? "random";
          });'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = '  const load = async () => {'
          insert = '''  useEffect(() => {
            window.localStorage.setItem("lucky-draw-forced-winner", forcedWinnerId);
          }, [forcedWinnerId]);

'''
          assert marker in s
          s = s.replace(marker, insert + marker, 1)

          stop_block = '''{isAdmin && !alreadySpunThisMonth && (
  <div className="mt-3 flex items-center gap-2 text-sm">
    <label htmlFor="forced-winner" className="text-muted-foreground">Stop at</label>
    <select
      id="forced-winner"
      value={forcedWinnerId}
      onChange={(e) => setForcedWinnerId(e.target.value)}
      className="h-9 rounded-md border border-input bg-background px-2 text-sm"
    >
      <option value="random">Random member</option>
      {eligible.map((m) => (
        <option key={m.id} value={m.id}>{`#${m.position} ${m.name}`}</option>
      ))}
    </select>
  </div>
)}

'''
          assert stop_block in s
          s = s.replace(stop_block, '', 1)
          index.write_text(s)

          admin = Path('src/routes/_authenticated/admin.tsx')
          a = admin.read_text()

          state_marker = '  const [makingVideoId, setMakingVideoId] = useState<string | null>(null);'
          state_insert = '''  const [makingVideoId, setMakingVideoId] = useState<string | null>(null);
  const [forcedWinnerId, setForcedWinnerId] = useState<string>(() => {
    if (typeof window === "undefined") return "random";
    return window.localStorage.getItem("lucky-draw-forced-winner") ?? "random";
  });'''
          assert state_marker in a
          a = a.replace(state_marker, state_insert, 1)

          effect_marker = '  useEffect(() => { reload(); }, []);'
          effect_insert = '''  useEffect(() => { reload(); }, []);

  useEffect(() => {
    window.localStorage.setItem("lucky-draw-forced-winner", forcedWinnerId);
  }, [forcedWinnerId]);'''
          assert effect_marker in a
          a = a.replace(effect_marker, effect_insert, 1)

          members_section = '''        <section className="rounded-2xl border border-border/60 bg-card/80 p-6 flex flex-col min-h-0">
          <div className="flex items-center justify-between mb-4 shrink-0">
            <h2 className="text-xl font-semibold text-gold">Members ({members.length})</h2>
            <Button size="sm" onClick={addMember} disabled={members.length >= 20}><Plus className="h-4 w-4 mr-1" /> Add member</Button>
          </div>'''
          members_new = '''        <section className="rounded-2xl border border-border/60 bg-card/80 p-6 flex flex-col min-h-0 overflow-hidden">
          <div className="flex items-center justify-between mb-4 shrink-0 rounded-lg border border-border/50 bg-background/30 p-3">
            <h2 className="text-xl font-semibold text-gold">Members ({members.length})</h2>
            <Button size="sm" onClick={addMember} disabled={members.length >= 20}><Plus className="h-4 w-4 mr-1" /> Add member</Button>
          </div>'''
          assert members_section in a
          a = a.replace(members_section, members_new, 1)

          past_marker = '''        <section className="rounded-2xl border border-border/60 bg-card/80 p-6 shrink-0">
          <h2 className="text-xl font-semibold text-gold flex items-center gap-2"><History className="h-5 w-5" /> Past Winners</h2>'''
          control = '''        <section className="rounded-2xl border border-border/60 bg-card/80 p-5 shrink-0">
          <div className="flex items-center justify-between gap-3">
            <div>
              <h2 className="text-lg font-semibold text-gold">Spin Control</h2>
              <p className="text-xs text-muted-foreground mt-1">Choose who the wheel should stop at for the next draw.</p>
            </div>
            <select
              id="admin-forced-winner"
              value={forcedWinnerId}
              onChange={(e) => setForcedWinnerId(e.target.value)}
              className="h-10 min-w-[190px] rounded-md border border-input bg-background px-3 text-sm"
            >
              <option value="random">Random member</option>
              {members.filter((m) => m.status === "active" && !m.is_winner).map((m) => (
                <option key={m.id} value={m.id}>{`#${m.position} ${m.name}`}</option>
              ))}
            </select>
          </div>
        </section>

        <section className="rounded-2xl border border-border/60 bg-card/80 p-6 shrink-0">
          <h2 className="text-xl font-semibold text-gold flex items-center gap-2"><History className="h-5 w-5" /> Past Winners</h2>'''
          assert past_marker in a
          a = a.replace(past_marker, control, 1)
          admin.write_text(a)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/routes/_authenticated/admin.tsx
          git commit -m "Move spin control to admin panel" || exit 0
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/one-time-admin-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time layout workflow"
          git push
